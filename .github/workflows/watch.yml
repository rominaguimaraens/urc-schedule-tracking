name: Watch agendas

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Only send a test notification"
        type: boolean
        default: false
      test_email:
        description: "Only send a test alert email to the whole Brevo list"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch-agendas
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check agendas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PING_ROLE_ID: ${{ secrets.DISCORD_PING_ROLE_ID }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then
            python watch.py --test-email
          elif [ "${{ inputs.test }}" = "true" ]; then
            python watch.py --test
          else
            python watch.py
          fi

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update agenda state"
            git push
          fi
